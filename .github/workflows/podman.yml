name: Build and Push Docker Images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'scripts/prod/docker/**'
      - 'Dockerfile'
      - 'package.json'
      - 'tsconfig.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'settings.template.jsonc'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      version_string:
        description: 'Custom version (optional)'
      is_latest:
        description: 'Apply "latest" tag to this build?'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      lower_repo: ${{ steps.repo_fix.outputs.repo }}
      is_semver: ${{ steps.versioning.outputs.is_semver }}
      is_latest: ${{ steps.versioning.outputs.is_latest }}
    steps:
      - name: Lowercase Repo Name
        id: repo_fix
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Determine version
        id: versioning
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version_string }}" ]]; then
            VERSION="${{ github.event.inputs.version_string }}"
            IS_SEMVER="true"
            IS_LATEST="${{ github.event.inputs.is_latest }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_SEMVER="true"
            IS_LATEST="true"
          else
            BRANCH="${{ github.ref_name }}"
            BRANCH_SAFE="${BRANCH//\//-}"
            BRANCH_SAFE="${BRANCH_SAFE//[^a-zA-Z0-9._-]/}"
            BRANCH_SAFE="${BRANCH_SAFE,,}"
            SHA="${GITHUB_SHA:0:8}"
            VERSION="${BRANCH_SAFE}-${SHA}"
            IS_SEMVER="false"
            IS_LATEST="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_semver=$IS_SEMVER" >> $GITHUB_OUTPUT
          echo "is_latest=$IS_LATEST" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            platform: linux/amd64
            targetarch: amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
            targetarch: arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@v2
        with:
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ needs.prepare.outputs.lower_repo }}:${{ matrix.targetarch }}-${{ needs.prepare.outputs.version }}
          containerfiles: ./Dockerfile

      - name: Push arch image to GHCR
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          echo "${{ steps.build_image.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.targetarch }}.digest"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.targetarch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          REPO="ghcr.io/${{ needs.prepare.outputs.lower_repo }}"
          VERSION="${{ needs.prepare.outputs.version }}"

          TAGS=("$REPO:$VERSION")

          if [[ "${{ needs.prepare.outputs.is_latest }}" == "true" ]]; then
            TAGS+=("$REPO:latest")
          fi

          if [[ "${{ needs.prepare.outputs.is_semver }}" == "true" ]]; then
            MAJOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f2)
            TAGS+=("$REPO:v${MAJOR}.${MINOR}")
            TAGS+=("$REPO:v${MAJOR}")
          fi

          for TAG in "${TAGS[@]}"; do
            podman manifest create "$TAG"
            for digest_file in ${{ runner.temp }}/digests/*.digest; do
              podman manifest add "$TAG" "$REPO@$(cat $digest_file)"
            done
            podman manifest push "$TAG" "docker://$TAG"
          done
